[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claim-evidence-auditor"
version = "0.1.0"
description = "A transparent, auditable workflow for reviewing claims against mapped evidence."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Nahid M42" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
claim-evidence-auditor = "claim_evidence_auditor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claim_evidence_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

